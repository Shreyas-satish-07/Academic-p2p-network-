services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: cohort-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cohort
    volumes:
      - mongo-data:/data/db
    networks:
      - cohort-network

  # Backend Express API Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cohort-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/cohort
      JWT_SECRET: supersecretproductionjwtkeyreplaceinproduction
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - cohort-network

  # Frontend React Client Service
  client:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
    container_name: cohort-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - cohort-network

volumes:
  mongo-data:
    driver: local

networks:
  cohort-network:
    driver: bridge

